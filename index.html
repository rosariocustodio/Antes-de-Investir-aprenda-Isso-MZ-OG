    <!-- Meta Pixel Code -->
    <script>
      (function() {
        var host = window.location.hostname;
        if (host.includes('aistudio.google.com')) {
          return;
        }

        var fbcVal = null;
        var fbpVal = null;

        // 1. Capturar fbclid e definir fbc imediatamente no formato canónico oficial da Meta
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var fbclid = urlParams.get('fbclid');
          if (!fbclid && document.referrer) {
            try {
              var ref = new URL(document.referrer);
              fbclid = ref.searchParams.get('fbclid');
            } catch(e) {}
          }

          var cookieDomain = window.location.hostname.indexOf('rumoseguros.site') !== -1 ? ';domain=.rumoseguros.site' : '';
          var maxAge = 60 * 60 * 24 * 90; // 90 dias

          if (fbclid) {
            fbcVal = 'fb.1.' + Date.now() + '.' + fbclid;
            document.cookie = '_fbc=' + encodeURIComponent(fbcVal) + ';path=/;max-age=' + maxAge + cookieDomain + ';SameSite=Lax';
            try {
              localStorage.setItem('_fbc', fbcVal);
              localStorage.setItem('meta_fbclid', fbclid);
              localStorage.setItem('meta_fbc_time', Date.now().toString());
              sessionStorage.setItem('_fbc', fbcVal);
            } catch(e) {}
          } else {
            // Tentar recuperar do cookie ou localStorage existente
            try {
              var m = document.cookie.match(/(^|;\s*)_fbc=([^;]*)/);
              if (m && m[2]) {
                fbcVal = decodeURIComponent(m[2]);
              } else if (window.localStorage) {
                fbcVal = localStorage.getItem('_fbc');
                var savedFbcId = localStorage.getItem('meta_fbclid');
                if (!fbcVal && savedFbcId) {
                  var savedTime = localStorage.getItem('meta_fbc_time') || Date.now().toString();
                  fbcVal = 'fb.1.' + savedTime + '.' + savedFbcId;
                }
              }
            } catch(e) {}
          }

          // 2. Garantir fbp (Browser ID) da Meta
          var mP = document.cookie.match(/(^|;\s*)_fbp=([^;]*)/);
          if (mP && mP[2]) {
            fbpVal = decodeURIComponent(mP[2]);
          } else if (window.localStorage) {
            fbpVal = localStorage.getItem('_fbp');
          }
          if (!fbpVal) {
            fbpVal = 'fb.1.' + Date.now() + '.' + Math.floor(1000000000 + Math.random() * 9000000000);
            document.cookie = '_fbp=' + encodeURIComponent(fbpVal) + ';path=/;max-age=' + maxAge + cookieDomain + ';SameSite=Lax';
            try { localStorage.setItem('_fbp', fbpVal); } catch(e) {}
          }
        } catch (e) {}

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        
        // Desativar autoConfig e regras automáticas da Meta (Event Setup Tool / ob3)
        fbq('set', 'autoConfig', false, '1433052258793282');

        // Intercetar e bloquear categoricamente qualquer disparo de "Purchase" no navegador
        var nativeFbq = window.fbq;
        var protectedFbq = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args[0] === 'track' && (args[1] === 'Purchase' || (typeof args[1] === 'string' && args[1].toLowerCase() === 'purchase'))) {
            console.warn('[Meta Security] Disparo automático de Purchase bloqueado com sucesso no navegador.');
            return;
          }
          return nativeFbq.apply(window, args);
        };
        for (var key in nativeFbq) {
          if (Object.prototype.hasOwnProperty.call(nativeFbq, key)) {
            protectedFbq[key] = nativeFbq[key];
          }
        }
        window.fbq = protectedFbq;

        window.__initialPageViewId = 'PageView_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        fbq('init', '1433052258793282');
        
        var pageViewOptions = { eventID: window.__initialPageViewId };
        if (fbcVal) pageViewOptions.fbc = fbcVal;
        if (fbpVal) pageViewOptions.fbp = fbpVal;
        fbq('track', 'PageView', {}, pageViewOptions);

        // Disparo Server-side Meta Conversions API (CAPI) com fbc e fbp garantidos
        try {
          fetch('/api/meta-events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event_name: 'PageView',
              event_id: window.__initialPageViewId,
              event_source_url: window.location.href,
              fbp: fbpVal,
              fbc: fbcVal
            }),
            keepalive: true
          }).catch(function() {});
        } catch(err) {}
      })();
    </script>
