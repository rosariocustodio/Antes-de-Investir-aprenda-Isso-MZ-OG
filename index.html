    <!-- Meta Pixel Code -->
    <script>
      (function() {
        var host = window.location.hostname;
        if (host.includes('aistudio.google.com')) {
          return;
        }

        try {
          var urlParams = new URLSearchParams(window.location.search);
          var fbclid = urlParams.get('fbclid');
          if (fbclid) {
            var fbcValue = 'fb.1.' + Date.now() + '.' + fbclid;
            var maxAge = 60 * 60 * 24 * 90;
            document.cookie = '_fbc=' + encodeURIComponent(fbcValue) + ';path=/;max-age=' + maxAge + ';SameSite=Lax';
            try { sessionStorage.setItem('meta_fbclid', fbclid); } catch(e) {}
          }
        } catch (e) {}

        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        
        window.__initialPageViewId = 'PageView_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
        fbq('init', '1433052258793282');
        fbq('track', 'PageView', {}, { eventID: window.__initialPageViewId });

        // Função para ler cookies da Meta (_fbp e _fbc)
        function getCookie(name) {
          try {
            var m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[2]) : null;
          } catch(e) { return null; }
        }

        // Disparo Server-side Meta Conversions API (CAPI) com deduplicação e dados enriquecidos
        try {
          fetch('/api/meta-events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              event_name: 'PageView',
              event_id: window.__initialPageViewId,
              event_source_url: window.location.href,
              fbp: getCookie('_fbp'),
              fbc: getCookie('_fbc')
            }),
            keepalive: true
          }).catch(function() {});
        } catch(err) {}
      })();
    </script>
